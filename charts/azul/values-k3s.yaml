## k3s profile: local-path storage, constrained resources, minimal plugins

storageClassName: local-path

restapi:
  minReplicas: 1
  maxReplicas: 1
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 1000m

plugins:
  yara-x:
    type: yara-x
    enabled: true
  maco:
    type: maco
    enabled: true
  suricata:
    type: suricata
    enabled: true
  generic:
    type: standard
    enabled: false
  virustotal:
    type: standard
    enabled: false
