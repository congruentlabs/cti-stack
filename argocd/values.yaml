## Global settings for CTI Stack App-of-Apps
global:
  ## Cluster profile: "k3s" or "rke2"
  clusterProfile: k3s

  ## Base domain for all ingresses (e.g., cti.example.com)
  ## Applications will be available at <app>.{{ baseDomain }}
  baseDomain: cti.local

  ## Git repository URL for this repo
  repoURL: https://github.com/example/cti-stack.git

  ## Git target revision (branch, tag, or commit)
  targetRevision: HEAD

  ## ArgoCD project name
  project: default

  ## Storage class (overridden per profile)
  storageClass: local-path

  ## Certificate issuer name
  clusterIssuer: cti-ca-issuer

  ## External TLS (for injecting certs from a separate CA)
  externalTls:
    enabled: false
    secretName: ""

  ## ISM/IRAP Security Hardening (PROTECTED level)
  security:
    podSecurity: true          # Pod Security Standards enforcement (ISM-1249)
    networkPolicies: true      # Default-deny + allow-list (ISM-1181)
    internalTls: true          # TLS on all internal services (ISM-1781)
    ingressHardening: true     # Security headers, TLS policy (ISM-1139)
    classificationBanner: true # Classification banner on all pages (ISM-0408)

  ## Classification marking (ISM-0408)
  classification: "PROTECTED"
  classificationBanner: "This system is classified PROTECTED. Unauthorised access is prohibited. All activity is monitored and logged."

## Namespace definitions
namespaces:
  infra: cti-infra
  azul: cti-azul
  opencti: cti-opencti
  mobsf: cti-mobsf
  monitoring: cti-monitoring

## Azul-specific settings
azul:
  ## Stable upstream Azul chart/app tag. Use azul-9.0.1 if you need to stay on v9.
  targetRevision: azul-10.0.0
  ## Set to true after initial deployment succeeds to enable plugins
  pluginsEnabled: false
  ## Optional CTI Stack custom Azul plugins. Enable only after the images are
  ## published and pinned to immutable digests.
  customPlugins:
    enabled: false
    images:
      mobsf: ghcr.io/congruentlabs/azul-plugin-mobsf:latest@sha256:ab2857b223d55529c68336e0e43bd635c6852b8f0a43e9a0a8da6ba5a026c303
      opencti: ghcr.io/congruentlabs/azul-plugin-opencti:latest@sha256:4a18187f3c63de301270f0c5de001c30bc631a3fbdccb798da6b2c7185cf873d
      openctiFeed: ghcr.io/congruentlabs/azul-plugin-opencti-feed:latest@sha256:aff327b6facbbabd2c53e22eb464df79999f2bf075f69bb2390c3156bed8b4b0
    endpoints:
      mobsf: "https://mobsf.cti.local"
      opencti: "https://opencti.cti.local"

## Application toggles
## Enable/disable each application and its dedicated data services.
## Core infrastructure (cert-manager, ingress, Keycloak, monitoring, operators)
## is always deployed. Per-app data services are deployed automatically when
## their consuming application is enabled.
apps:
  azul: true       # + azul-opensearch, azul-minio, kafka
  opencti: true    # + opencti-opensearch, opencti-minio, opencti-postgresql, redis, rabbitmq
  mobsf: true      # + mobsf-postgresql
